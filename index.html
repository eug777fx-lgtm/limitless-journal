    <style>
      html, body { background: #000; margin: 0; }
      .ltj-boot { position: fixed; inset: 0; z-index: 99999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; overflow: hidden; transition: opacity .55s cubic-bezier(.22, 1, .36, 1), transform .55s cubic-bezier(.22, 1, .36, 1); }
      .ltj-boot.out { opacity: 0; pointer-events: none; }
      .ltj-boot-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 72px 72px; -webkit-mask-image: radial-gradient(60% 50% at 50% 50%, #000 10%, transparent 75%); mask-image: radial-gradient(60% 50% at 50% 50%, #000 10%, transparent 75%); }
      .ltj-boot-spot { position: absolute; left: 50%; top: 50%; width: 900px; height: 600px; margin: -300px 0 0 -450px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.09), transparent); }
      .ltj-boot-chip { position: relative; width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, rgba(255,255,255,0.26), rgba(255,255,255,0.08)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 0 0 1px rgba(255,255,255,0.16), 0 10px 30px rgba(0,0,0,0.5); animation: ltjBreath 2.4s ease-in-out infinite; }
      .ltj-boot-chip img { width: 36px; height: auto; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35)); }
      .ltj-boot-bar { position: relative; width: 112px; height: 2px; border-radius: 99px; background: rgba(255,255,255,0.10); overflow: hidden; }
      .ltj-boot-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 38%; border-radius: 99px; background: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.6); animation: ltjSlide 1.25s cubic-bezier(.65, 0, .35, 1) infinite; }
      #app-loader .ltj-boot-chip { animation: ltjIn .7s cubic-bezier(.34, 1.56, .64, 1) both, ltjBreath 2.4s ease-in-out .7s infinite; }
      #app-loader .ltj-boot-bar { animation: ltjFade .5s ease .25s both; }
      @keyframes ltjIn { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
      @keyframes ltjFade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes ltjBreath { 0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 0 0 1px rgba(255,255,255,0.16), 0 10px 30px rgba(0,0,0,0.5), 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), inset 0 0 0 1px rgba(255,255,255,0.2), 0 10px 30px rgba(0,0,0,0.5), 0 0 44px rgba(255,255,255,0.16); } }
      @keyframes ltjSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { .ltj-boot-chip, #app-loader .ltj-boot-chip, .ltj-boot-bar i { animation: none !important; } .ltj-boot-bar i { left: 31%; } }
    </style>
  </head>
  <body>
    <div id="app-loader" class="ltj-boot" role="status" aria-label="Loading LIMITLESS">
      <div class="ltj-boot-grid"></div>
      <div class="ltj-boot-spot"></div>
      <div class="ltj-boot-chip"><img src="/logo2.png" alt="" /></div>
      <div class="ltj-boot-bar"><i></i></div>
    </div>
    <script>
      // Safety net: never leave the boot layer up if something fails to load.
      setTimeout(function () { var l = document.getElementById('app-loader'); if (l) { l.classList.add('out'); setTimeout(function () { l.remove() }, 650) } }, 12000)
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
